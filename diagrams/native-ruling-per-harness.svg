<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, system-ui, sans-serif" viewBox="0 0 980 250" role="img" aria-label="Three gate styles side by side: per-call ruling where the harness asks Barry's decide function on each tool call; static hook where a generated script with a baked allow set answers locally; and settings-only where deny rules in the vendor settings are the only control.">
  <defs><marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
  <g font-size="12" fill="currentColor">
    <!-- column 1 per-call -->
    <text x="160" y="24" text-anchor="middle" font-weight="700">Per-call ruling</text>
    <text x="160" y="40" text-anchor="middle" font-size="11" fill="#7c8689">claude, codex, cursor, opencode, pi (hosted)</text>
    <rect x="60" y="60" width="200" height="34" rx="5" fill="#ffffff" stroke="#c0c8c3"/><text x="160" y="82" text-anchor="middle">harness engine</text>
    <rect x="60" y="150" width="200" height="34" rx="5" fill="#d9eef0" stroke="#0e7c86"/><text x="160" y="172" text-anchor="middle">Barry decide()</text>
    <line x1="140" y1="96" x2="140" y2="148" stroke="currentColor" stroke-width="1.2" marker-end="url(#arG)"/><text x="134" y="126" text-anchor="end" font-size="11">each call</text>
    <line x1="180" y1="148" x2="180" y2="96" stroke="currentColor" stroke-width="1.2" marker-end="url(#arG)"/><text x="186" y="126" font-size="11">allow/deny</text>
    <text x="160" y="215" text-anchor="middle" font-size="11.5" fill="#4a5558">live policy; today allows all not</text><text x="160" y="230" text-anchor="middle" font-size="11.5" fill="#4a5558">statically denied (no interactive ruling)</text>

    <!-- column 2 static hook -->
    <text x="490" y="24" text-anchor="middle" font-weight="700">Static hook script</text>
    <text x="490" y="40" text-anchor="middle" font-size="11" fill="#7c8689">codex, cursor, antigravity (TUI); antigravity (hosted)</text>
    <rect x="390" y="60" width="200" height="34" rx="5" fill="#ffffff" stroke="#c0c8c3"/><text x="490" y="82" text-anchor="middle">harness TUI</text>
    <rect x="390" y="150" width="200" height="34" rx="5" fill="#f7e9d2" stroke="#bf7a16"/><text x="490" y="172" text-anchor="middle" class="mono" font-size="11.5">barry-tool-gate.cjs</text>
    <line x1="470" y1="96" x2="470" y2="148" stroke="currentColor" stroke-width="1.2" marker-end="url(#arG)"/><text x="464" y="126" text-anchor="end" font-size="11">PreToolUse</text>
    <line x1="510" y1="148" x2="510" y2="96" stroke="currentColor" stroke-width="1.2" marker-end="url(#arG)"/><text x="516" y="126" font-size="11">deny or silence</text>
    <text x="490" y="215" text-anchor="middle" font-size="11.5" fill="#4a5558">allow set baked at launch; no round trip;</text><text x="490" y="230" text-anchor="middle" font-size="11.5" fill="#4a5558">hook failure semantics unverified</text>

    <!-- column 3 settings only -->
    <text x="820" y="24" text-anchor="middle" font-weight="700">Settings only</text>
    <text x="820" y="40" text-anchor="middle" font-size="11" fill="#7c8689">claude-code (instrumented, guest)</text>
    <rect x="720" y="60" width="200" height="34" rx="5" fill="#ffffff" stroke="#c0c8c3"/><text x="820" y="82" text-anchor="middle">claude TUI</text>
    <rect x="720" y="150" width="200" height="34" rx="5" fill="#ffffff" stroke="#e34948"/><text x="820" y="172" text-anchor="middle" class="mono" font-size="11.5">permissions.deny</text>
    <line x1="820" y1="96" x2="820" y2="148" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arG)"/><text x="828" y="126" font-size="11">reads at start</text>
    <text x="820" y="215" text-anchor="middle" font-size="11.5" fill="#4a5558">user's global ~/.claude hooks and</text><text x="820" y="230" text-anchor="middle" font-size="11.5" fill="#4a5558">allow rules still load</text>
  </g>
</svg>
