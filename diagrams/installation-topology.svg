<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, system-ui, sans-serif" color="#151b1e" viewBox="0 0 980 420" role="img" aria-label="Topology of a Barry installation on one Mac: launchd supervises the MCP server, the sessions API, the identities service and the scheduler; each bag owns a SQLite store; the CLI, harnesses and hooks talk to the services over local HTTP."><rect x="-5" y="-5" width="990.0" height="430.0" fill="#ffffff"/>
  <defs><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
  <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <!-- launchd band -->
    <rect x="20" y="20" width="940" height="150" rx="10" fill="none" stroke="#c0c8c3" stroke-dasharray="6 4"/>
    <text x="34" y="42" font-family="IBM Plex Mono, monospace" font-size="12" fill="#7c8689">launchd gui/&lt;uid&gt; · labels carry the instance UUID · KeepAlive · log rotation</text>
    <g stroke="#0e7c86" stroke-width="1.5" fill="#ffffff">
      <rect x="40" y="60" width="200" height="90" rx="7"/>
      <rect x="270" y="60" width="200" height="90" rx="7"/>
      <rect x="500" y="60" width="200" height="90" rx="7"/>
      <rect x="730" y="60" width="200" height="90" rx="7"/>
    </g>
    <g font-weight="600" font-size="13">
      <text x="140" y="82" text-anchor="middle">mcp.server</text>
      <text x="370" y="82" text-anchor="middle">sessions.api</text>
      <text x="600" y="82" text-anchor="middle">identities.server</text>
      <text x="830" y="82" text-anchor="middle">schedules.scheduler</text>
    </g>
    <g font-size="11.5" fill="#4a5558" text-anchor="middle">
      <text x="140" y="102">every packed bag's tools,</text><text x="140" y="117">filtered per session;</text><text x="140" y="132">service control</text>
      <text x="370" y="102">session rows, engines,</text><text x="370" y="117">hosted runs, WS streams,</text><text x="370" y="132">the tool-call gate</text>
      <text x="600" y="102">identities, traits, bounds,</text><text x="600" y="117">device credentials,</text><text x="600" y="132">request authorization</text>
      <text x="830" y="102">cron / once / login fires,</text><text x="830" y="117">job runners,</text><text x="830" y="132">action runs</text>
    </g>

    <!-- stores band -->
    <text x="34" y="205" font-weight="600" font-size="13">SQLite stores, one per bag, migrated on open</text>
    <g font-family="IBM Plex Mono, monospace" font-size="11.5" text-anchor="middle">
      <g fill="#eaeee9" stroke="#c0c8c3" stroke-width="1">
        <rect x="40" y="216" width="104" height="30" rx="4"/><rect x="152" y="216" width="104" height="30" rx="4"/><rect x="264" y="216" width="104" height="30" rx="4"/><rect x="376" y="216" width="104" height="30" rx="4"/><rect x="488" y="216" width="104" height="30" rx="4"/><rect x="600" y="216" width="104" height="30" rx="4"/><rect x="712" y="216" width="104" height="30" rx="4"/><rect x="824" y="216" width="104" height="30" rx="4"/>
      </g>
      <text x="92" y="235">sessions.db</text><text x="204" y="235">identities.db</text><text x="316" y="235">schedules.db</text><text x="428" y="235">actions.db</text><text x="540" y="235">events.db</text><text x="652" y="235">telemetry ×4</text><text x="764" y="235">memory.db</text><text x="876" y="235">+ 10 more</text>
    </g>
    <g stroke="#7c8689" stroke-width="1" stroke-dasharray="2 3">
      <line x1="140" y1="150" x2="140" y2="214"/><line x1="370" y1="150" x2="370" y2="214"/><line x1="600" y1="150" x2="600" y2="214"/><line x1="830" y1="150" x2="830" y2="214"/>
    </g>

    <!-- clients band -->
    <text x="34" y="290" font-weight="600" font-size="13">Who talks to the services (local HTTP + BARRY_SECRET)</text>
    <g stroke="#bf7a16" stroke-width="1.5" fill="#ffffff">
      <rect x="40" y="304" width="180" height="90" rx="7"/>
      <rect x="250" y="304" width="220" height="90" rx="7"/>
      <rect x="500" y="304" width="200" height="90" rx="7"/>
      <rect x="730" y="304" width="200" height="90" rx="7"/>
    </g>
    <g font-weight="600" font-size="13" text-anchor="middle">
      <text x="130" y="326">barry / &lt;identity&gt; CLI</text>
      <text x="360" y="326">harness process</text>
      <text x="600" y="326">barry-hook</text>
      <text x="830" y="326">bag code (Barry client)</text>
    </g>
    <g font-size="11.5" fill="#4a5558" text-anchor="middle">
      <text x="130" y="346">start, resume, pack,</text><text x="130" y="361">service, doctor, up/down;</text><text x="130" y="376">also hosts services in-process</text>
      <text x="360" y="346">Claude Code, Codex, Cursor,</text><text x="360" y="361">OpenCode, Pi, Antigravity;</text><text x="360" y="376">MCP client of mcp.server</text>
      <text x="600" y="346">spawned by the harness on</text><text x="600" y="361">each lifecycle/tool event;</text><text x="600" y="376">asks the API to allow/deny</text>
      <text x="830" y="346">jobs, hooks and services</text><text x="830" y="361">call events, sessions,</text><text x="830" y="376">actions, schedules over HTTP</text>
    </g>
    <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ar2)" opacity=".7">
      <line x1="130" y1="302" x2="130" y2="250"/>
      <line x1="360" y1="302" x2="360" y2="250"/>
      <line x1="600" y1="302" x2="600" y2="250"/>
      <line x1="830" y1="302" x2="830" y2="250"/>
    </g>
  </g>
</svg>
