<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, system-ui, sans-serif" color="#151b1e" viewBox="0 0 980 330" role="img" aria-label="Route groups of the sessions API as proportional bars: sessions lifecycle and reads 35 routes, actions 8, schedules 12, prompts 4, changes 5, jobs 3, v2 AG-UI 4, OTLP 2, health and webhooks 4; a second bar per group shows how many are outside the OpenAPI contract."><rect x="-5" y="-5" width="990.0" height="340.0" fill="#ffffff"/>
  <g font-size="12" fill="currentColor">
    <text x="20" y="24" font-weight="600" font-size="13">Routes per group (teal) and routes outside the OpenAPI contract (amber)</text>
    <g class="mono" font-size="11.5" text-anchor="end">
      <text x="190" y="58">sessions (v1)</text><text x="190" y="88">schedules</text><text x="190" y="118">actions</text><text x="190" y="148">changes</text><text x="190" y="178">prompts</text><text x="190" y="208">v2 AG-UI</text><text x="190" y="238">health · root · webhooks</text><text x="190" y="268">jobs</text><text x="190" y="298">OTLP /v1</text>
    </g>
    <!-- 1 route = 18px -->
    <g fill="#0e7c86"><rect x="200" y="46" width="630" height="14" rx="3"/><rect x="200" y="76" width="216" height="14" rx="3"/><rect x="200" y="106" width="144" height="14" rx="3"/><rect x="200" y="136" width="90" height="14" rx="3"/><rect x="200" y="166" width="72" height="14" rx="3"/><rect x="200" y="196" width="72" height="14" rx="3"/><rect x="200" y="226" width="72" height="14" rx="3"/><rect x="200" y="256" width="54" height="14" rx="3"/><rect x="200" y="286" width="36" height="14" rx="3"/></g>
    <g fill="#bf7a16"><rect x="200" y="62" width="180" height="6" rx="2"/><rect x="200" y="92" width="126" height="6" rx="2"/><rect x="200" y="122" width="18" height="6" rx="2"/><rect x="200" y="182" width="54" height="6" rx="2"/><rect x="200" y="242" width="18" height="6" rx="2"/><rect x="200" y="302" width="36" height="6" rx="2"/></g>
    <g font-size="11.5" fill="#4a5558"><text x="838" y="58">35 · 10 outside</text><text x="424" y="88">12 · 7 outside</text><text x="352" y="118">8 · 1 outside</text><text x="298" y="148">5</text><text x="280" y="178">4 · 3 outside</text><text x="280" y="208">4</text><text x="280" y="238">4 · 1 outside</text><text x="262" y="268">3</text><text x="244" y="298">2 · 2 outside</text></g>
    <text x="20" y="325" font-size="11.5" fill="#7c8689">Auth: everything but /health, /health/live, / and the signed webhook requires the instance secret or a scoped device principal (GET-only). Loopback bind.</text>
  </g>
</svg>
