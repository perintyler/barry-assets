<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, system-ui, sans-serif" color="#151b1e" viewBox="0 0 980 230" role="img" aria-label="Three columns: hosted, where Barry holds the engine and every event; instrumented, where a human drives the TUI with side doors for delivery, capture and gating; guest, where Barry only sees the transcript and hook deliveries."><rect x="-5" y="-5" width="990.0" height="240.0" fill="#ffffff"/>
  <g font-size="12" fill="currentColor">
    <g fill="#ffffff" stroke-width="1.5">
      <rect x="20" y="20" width="300" height="190" rx="8" stroke="#0e7c86"/><rect x="340" y="20" width="300" height="190" rx="8" stroke="#bf7a16"/><rect x="660" y="20" width="300" height="190" rx="8" stroke="#c0c8c3"/>
    </g>
    <g font-weight="700" font-size="14"><text x="36" y="46">hosted</text><text x="356" y="46">instrumented</text><text x="676" y="46">guest</text></g>
    <g font-size="11.5" fill="#4a5558">
      <text x="36" y="68">Who drives: Barry (API or CLI)</text><text x="36" y="86">Holds: the engine, every event,</text><text x="36" y="102">delivery, interrupt, a ruling per call</text>
      <text x="36" y="126">Harnesses: all six</text>
      <text x="36" y="150">Recorded guarantee: total capture,</text><text x="36" y="166">steer, interrupt, per-call gating</text>
      <text x="36" y="196" fill="#7c8689">a TUI may attach to it (codex)</text>

      <text x="356" y="68">Who drives: a human in the vendor TUI</text><text x="356" y="86">Holds: side doors opened at launch:</text><text x="356" y="102">delivery, live capture (OTLP), hook gate</text>
      <text x="356" y="126">Harnesses: claude, codex, cursor,</text><text x="356" y="142">antigravity (opencode: none, pi: none)</text>
      <text x="356" y="166">Capture via OTLP push + hooks;</text><text x="356" y="182">gate is a static script or settings</text>

      <text x="676" y="68">Who drives: a human in the vendor TUI</text><text x="676" y="86">Holds: what the harness leaves behind:</text><text x="676" y="102">transcript file, hook-triggered deliveries</text>
      <text x="676" y="126">Harnesses: claude, codex, cursor,</text><text x="676" y="142">opencode, antigravity</text>
      <text x="676" y="166">Checked by CI: a guest mode cannot</text><text x="676" y="182">claim total capture or interrupt</text>
    </g>
  </g>
</svg>
