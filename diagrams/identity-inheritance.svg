<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, system-ui, sans-serif" color="#151b1e" viewBox="0 0 980 300" role="img" aria-label="Identity inheritance: the base identity barry at the repository root defines 15 bags, 5 default traits and 5 optional bounds; a child identity bonanza inherits them, adds the embeddings bag, and selects the readonly bound for a particular session."><rect x="-5" y="-5" width="990.0" height="310.0" fill="#ffffff"/>
  <defs><marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
  <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <rect x="20" y="30" width="300" height="240" rx="8" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="36" y="56" font-weight="700" font-size="14">base</text>
    <text x="36" y="74" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#7c8689">identity.yaml at repo root</text>
    <g font-size="12">
      <text x="36" y="104" font-weight="600">bags</text><text x="36" y="121" fill="#4a5558">actions artifacts bash decisions embeddings</text><text x="36" y="137" fill="#4a5558">events filesystem identities instructions mcp</text><text x="36" y="153" fill="#4a5558">memory nodes schedules sessions(+search) telemetry</text>
      <text x="36" y="181" font-weight="600">traits (default)</text><text x="36" y="198" fill="#4a5558">artifacts bash filesystem instructions sessions</text>
      <text x="36" y="226" font-weight="600">bounds (optional)</text><text x="36" y="243" fill="#4a5558">readonly no-secrets no-network</text><text x="36" y="259" fill="#4a5558">no-network-write sandboxed-offline</text>
    </g>

    <line x1="322" y1="150" x2="398" y2="150" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar3)"/>
    <text x="360" y="140" text-anchor="middle" font-size="11" fill="#7c8689">inherits</text>

    <rect x="400" y="60" width="260" height="180" rx="8" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.5"/>
    <text x="416" y="86" font-weight="700" font-size="14">bonanza</text>
    <text x="416" y="104" font-family="IBM Plex Mono, monospace" font-size="11.5" fill="#7c8689">~/repos/barry/barry-bonanza/</text>
    <g font-size="12">
      <text x="416" y="132" font-weight="600">adds</text><text x="416" y="149" fill="#4a5558">bags: + embeddings (own store)</text><text x="416" y="165" fill="#4a5558">vault: its own secrets</text>
      <text x="416" y="193" font-weight="600">may</text><text x="416" y="210" fill="#4a5558">select an optional bound, add traits,</text><text x="416" y="226" fill="#4a5558">switch adapter; not redefine a name</text>
    </g>

    <line x1="662" y1="150" x2="738" y2="150" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar3)"/>
    <text x="700" y="140" text-anchor="middle" font-size="11" fill="#7c8689">start</text>

    <rect x="740" y="90" width="220" height="120" rx="8" fill="#d9eef0" stroke="#0e7c86" stroke-width="1.5"/>
    <text x="756" y="116" font-weight="700" font-size="14">session yZ4Zz9…</text>
    <g font-size="12" fill="#4a5558">
      <text x="756" y="140">traits: defaults + embeddings</text>
      <text x="756" y="158">bound: readonly (selected)</text>
      <text x="756" y="176">adapter: claude-code, hosted</text>
      <text x="756" y="194">cli: bonanza</text>
    </g>
  </g>
</svg>
