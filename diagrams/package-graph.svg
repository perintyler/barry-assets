<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, system-ui, sans-serif" color="#151b1e" viewBox="0 0 1100 560" role="img" aria-label="Layered dependency graph. Bottom: the SDK. Middle: leaf bags and adapters that depend only on the SDK. Upper middle: bags that depend on other bags (mcp-bag, sessions-search, locks). Top: composition roots cli, sessions-api, scheduler, identities-service, workflows-runtime, which import many bags."><rect x="-5" y="-5" width="1110.0" height="570.0" fill="#ffffff"/>
  <defs><marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
  <g font-size="12" fill="currentColor">
    <!-- layer labels -->
    <g fill="#7c8689" font-size="11" class="mono">
      <text x="12" y="48">composition roots</text>
      <text x="12" y="208">bags that import bags</text>
      <text x="12" y="338">leaf bags (sdk only)</text>
      <text x="12" y="438">adapters (sdk only)</text>
      <text x="12" y="528">kit</text>
    </g>
    <g stroke="#d6dcd8" stroke-dasharray="3 4"><line x1="0" y1="150" x2="1100" y2="150"/><line x1="0" y1="290" x2="1100" y2="290"/><line x1="0" y1="400" x2="1100" y2="400"/><line x1="0" y1="490" x2="1100" y2="490"/></g>

    <!-- SDK -->
    <rect x="170" y="500" width="760" height="40" rx="6" fill="#d9eef0" stroke="#0e7c86" stroke-width="1.5"/>
    <text x="550" y="525" text-anchor="middle" font-weight="700" font-size="13">@barry-rocks/sdk · every package above depends on it</text>

    <!-- adapters row -->
    <g fill="#ffffff" stroke="#eda100" stroke-width="1.2">
      <rect x="170" y="412" width="100" height="30" rx="4"/><rect x="280" y="412" width="100" height="30" rx="4"/><rect x="390" y="412" width="100" height="30" rx="4"/><rect x="500" y="412" width="100" height="30" rx="4"/><rect x="610" y="412" width="100" height="30" rx="4"/><rect x="720" y="412" width="100" height="30" rx="4"/><rect x="830" y="412" width="100" height="30" rx="4"/>
    </g>
    <g text-anchor="middle" class="mono" font-size="11">
      <text x="220" y="431">session-claude</text><text x="330" y="431">session-codex</text><text x="440" y="431">session-cursor</text><text x="550" y="431">session-opencode</text><text x="660" y="431">session-pi ✱</text><text x="770" y="431">session-antigravity ✱</text><text x="880" y="431">completions ×3</text>
    </g>
    <text x="990" y="431" font-size="11" fill="#7c8689">✱ not imported by cli</text>
    <text x="990" y="447" font-size="11" fill="#7c8689">decisions ×5, embedding ×1</text>

    <!-- leaf bags row -->
    <g fill="#ffffff" stroke="#2a78d6" stroke-width="1.2">
      <rect x="170" y="306" width="92" height="30" rx="4"/><rect x="270" y="306" width="92" height="30" rx="4"/><rect x="370" y="306" width="92" height="30" rx="4"/><rect x="470" y="306" width="92" height="30" rx="4"/><rect x="570" y="306" width="92" height="30" rx="4"/><rect x="670" y="306" width="92" height="30" rx="4"/><rect x="770" y="306" width="92" height="30" rx="4"/><rect x="870" y="306" width="92" height="30" rx="4"/>
      <rect x="170" y="350" width="92" height="30" rx="4"/><rect x="270" y="350" width="92" height="30" rx="4"/><rect x="370" y="350" width="92" height="30" rx="4"/><rect x="470" y="350" width="92" height="30" rx="4"/><rect x="570" y="350" width="92" height="30" rx="4"/><rect x="670" y="350" width="92" height="30" rx="4"/><rect x="770" y="350" width="92" height="30" rx="4"/><rect x="870" y="350" width="92" height="30" rx="4"/>
    </g>
    <g text-anchor="middle" class="mono" font-size="11">
      <text x="216" y="325">sessions</text><text x="316" y="325">identities</text><text x="416" y="325">events</text><text x="516" y="325">schedules</text><text x="616" y="325">tracker</text><text x="716" y="325">artifacts</text><text x="816" y="325">filesystem</text><text x="916" y="325">memory</text>
      <text x="216" y="369">bash</text><text x="316" y="369">vault</text><text x="416" y="369">workflows</text><text x="516" y="369">nodes</text><text x="616" y="369">logs</text><text x="716" y="369">decisions</text><text x="816" y="369">embeddings</text><text x="916" y="369">telemetry ⇢ logs</text>
    </g>

    <!-- middle: bags that import bags -->
    <g fill="#ffffff" stroke="#4a3aa7" stroke-width="1.4">
      <rect x="170" y="196" width="170" height="60" rx="5"/><rect x="420" y="196" width="150" height="60" rx="5"/><rect x="640" y="196" width="130" height="60" rx="5"/><rect x="820" y="196" width="140" height="60" rx="5"/>
    </g>
    <g text-anchor="middle">
      <text x="255" y="218" font-weight="600" class="mono">mcp-bag</text><text x="255" y="236" font-size="11" fill="#4a5558">identities, sessions, actions,</text><text x="255" y="250" font-size="11" fill="#4a5558">events, schedules, locks, tracker</text>
      <text x="495" y="218" font-weight="600" class="mono">actions · instructions</text><text x="495" y="240" font-size="11" fill="#4a5558">→ artifacts</text>
      <text x="705" y="218" font-weight="600" class="mono">locks</text><text x="705" y="240" font-size="11" fill="#4a5558">→ tracker</text>
      <text x="890" y="218" font-weight="600" class="mono">sessions-search</text><text x="890" y="240" font-size="11" fill="#4a5558">→ sessions, embeddings</text>
    </g>

    <!-- top: composition roots -->
    <g fill="#ffffff" stroke="#eb6834" stroke-width="1.6">
      <rect x="170" y="36" width="200" height="90" rx="6"/><rect x="400" y="36" width="220" height="90" rx="6"/><rect x="650" y="36" width="130" height="90" rx="6"/><rect x="800" y="36" width="130" height="90" rx="6"/><rect x="950" y="36" width="130" height="90" rx="6"/>
    </g>
    <g text-anchor="middle">
      <text x="270" y="58" font-weight="700" class="mono">cli</text><text x="270" y="78" font-size="11" fill="#4a5558">7 bags · 4 harness adapters</text><text x="270" y="94" font-size="11" fill="#4a5558">8 model adapters · sessions-api</text><text x="270" y="110" font-size="11" fill="#4a5558">identities-service</text>
      <text x="510" y="58" font-weight="700" class="mono">sessions-api</text><text x="510" y="78" font-size="11" fill="#4a5558">7 bags · scheduler</text><text x="510" y="94" font-size="11" fill="#4a5558">8 model adapters</text><text x="510" y="110" font-size="11" fill="#4a5558">mounts events/actions/schedules routers</text>
      <text x="715" y="58" font-weight="700" class="mono">scheduler</text><text x="715" y="80" font-size="11" fill="#4a5558">schedules, actions,</text><text x="715" y="96" font-size="11" fill="#4a5558">identities</text>
      <text x="865" y="58" font-weight="700" class="mono">identities-service</text><text x="865" y="80" font-size="11" fill="#4a5558">→ sessions</text>
      <text x="1015" y="58" font-weight="700" class="mono">workflows-runtime</text><text x="1015" y="80" font-size="11" fill="#4a5558">workflows,</text><text x="1015" y="96" font-size="11" fill="#4a5558">identities</text>
    </g>
    <!-- a few representative edges -->
    <g stroke="currentColor" stroke-width="1" opacity=".45" marker-end="url(#arD)">
      <line x1="255" y1="128" x2="255" y2="194"/>
      <line x1="300" y1="128" x2="510" y2="304"/>
      <line x1="470" y1="128" x2="470" y2="194"/>
      <line x1="540" y1="128" x2="890" y2="194"/>
      <line x1="560" y1="128" x2="716" y2="304"/>
      <line x1="255" y1="258" x2="216" y2="304"/>
      <line x1="705" y1="258" x2="616" y2="304"/>
      <line x1="890" y1="258" x2="816" y2="348"/>
      <line x1="716" y1="128" x2="516" y2="304"/>
      <line x1="865" y1="128" x2="240" y2="304"/>
      <line x1="1015" y1="128" x2="416" y2="348"/>
      <line x1="216" y1="382" x2="216" y2="498"/><line x1="550" y1="444" x2="550" y2="498"/>
    </g>
  </g>
</svg>
