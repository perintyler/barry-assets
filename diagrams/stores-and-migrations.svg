<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, system-ui, sans-serif" color="#151b1e" viewBox="0 0 980 300" role="img" aria-label="Bar chart of SQL migration counts per store: sessions 19, schedules 7, artifacts 6, identities 5, workflows 5, sdk-workflows 5, actions 4, cli config 3, nodes peers 3, telemetry metrics 2, and eleven stores with a single baseline migration."><rect x="-5" y="-5" width="990.0" height="310.0" fill="#ffffff"/>
  <g font-size="12" fill="currentColor">
    <g class="mono" font-size="11.5" text-anchor="end">
      <text x="150" y="34">sessions</text><text x="150" y="60">schedules</text><text x="150" y="86">artifacts</text><text x="150" y="112">identities</text><text x="150" y="138">workflows (bag)</text><text x="150" y="164">workflows (sdk)</text><text x="150" y="190">actions</text><text x="150" y="216">cli config · nodes</text><text x="150" y="242">telemetry metrics</text><text x="150" y="268">11 stores at baseline</text>
    </g>
    <!-- 1 migration = 36px -->
    <g fill="#2a78d6"><rect x="160" y="22" width="684" height="16" rx="3"/><rect x="160" y="48" width="252" height="16" rx="3"/><rect x="160" y="74" width="216" height="16" rx="3"/><rect x="160" y="100" width="180" height="16" rx="3"/><rect x="160" y="126" width="180" height="16" rx="3"/><rect x="160" y="152" width="180" height="16" rx="3"/><rect x="160" y="178" width="144" height="16" rx="3"/><rect x="160" y="204" width="108" height="16" rx="3"/><rect x="160" y="230" width="72" height="16" rx="3"/><rect x="160" y="256" width="36" height="16" rx="3"/></g>
    <g font-size="11.5" fill="#4a5558"><text x="852" y="35">19 · 17 tables + FTS5</text><text x="420" y="61">7</text><text x="384" y="87">6</text><text x="348" y="113">5</text><text x="348" y="139">5</text><text x="348" y="165">5 (a second workflows schema)</text><text x="312" y="191">4</text><text x="276" y="217">3 each</text><text x="240" y="243">2</text><text x="204" y="269">1 each: events, memory, locks, tracker, embeddings, decisions, logs, usage, requests, errors</text></g>
  </g>
</svg>
