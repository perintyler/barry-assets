<svg xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, system-ui, sans-serif" color="#151b1e" viewBox="0 0 980 400" role="img" aria-label="A bag.yaml manifest on the left with its sections (name, bags, requires, tools, traits, bounds, services, hooks, jobs, schedules, instructions, prompts, dependencies, scripts, vendors) connected by arrows to the host components that consume them on the right."><rect x="-5" y="-5" width="990.0" height="410.0" fill="#ffffff"/>
  <defs><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
  <g font-size="12" fill="currentColor">
    <rect x="20" y="20" width="300" height="360" rx="8" fill="#ffffff" stroke="#c0c8c3"/>
    <text x="36" y="44" font-weight="700" class="mono" font-size="13">bag.yaml</text>
    <g class="mono" font-size="12">
      <text x="36" y="72">name, description</text>
      <text x="36" y="96">bags: [tracker, events, actions]</text>
      <text x="36" y="120">requires: { identities: … }</text>
      <text x="36" y="144">tools: [services_list: deferred]</text>
      <text x="36" y="168">traits: { services: {…} }</text>
      <text x="36" y="192">bounds: { no-bash: {…} }</text>
      <text x="36" y="216">services: { server: {entry…} }</text>
      <text x="36" y="240">hooks: { agent: [...] }</text>
      <text x="36" y="264">jobs: · schedules:</text>
      <text x="36" y="288">instructions: · prompts:</text>
      <text x="36" y="312">dependencies: { ollama: … }</text>
      <text x="36" y="336">scripts: · vendors:</text>
      <text x="36" y="360">stores (migrations/*.sql)</text>
    </g>
    <!-- consumers -->
    <g fill="#ffffff" stroke="#0e7c86" stroke-width="1.3">
      <rect x="560" y="30" width="400" height="44" rx="5"/><rect x="560" y="86" width="400" height="44" rx="5"/><rect x="560" y="142" width="400" height="44" rx="5"/><rect x="560" y="198" width="400" height="44" rx="5"/><rect x="560" y="254" width="400" height="44" rx="5"/><rect x="560" y="310" width="400" height="44" rx="5"/>
    </g>
    <g font-size="12">
      <text x="572" y="48" font-weight="600">Registry + composition (sdk/src/bags)</text><text x="572" y="65" fill="#4a5558" font-size="11.5">absorbs child bags, generates the automatic trait, validates names</text>
      <text x="572" y="104" font-weight="600">MCP host (bags/mcp)</text><text x="572" y="121" fill="#4a5558" font-size="11.5">bundles tools with esbuild to a cache, serves them filtered per session</text>
      <text x="572" y="160" font-weight="600">Identities store (bags/identities)</text><text x="572" y="177" fill="#4a5558" font-size="11.5">traits and bounds become rows; `pack` syncs them; qualified as bag:name</text>
      <text x="572" y="216" font-weight="600">Service manager (cli/src/services, launchd)</text><text x="572" y="233" fill="#4a5558" font-size="11.5">prepares env and ports, writes plists, rotates logs, health checks</text>
      <text x="572" y="272" font-weight="600">Hook dispatcher + scheduler</text><text x="572" y="289" fill="#4a5558" font-size="11.5">barry-hook runs hook scripts per harness event; scheduler runs jobs on triggers</text>
      <text x="572" y="328" font-weight="600">Prompt assembly + store opener</text><text x="572" y="345" fill="#4a5558" font-size="11.5">instructions and prompt contributors join the system prompt; stores migrate on open</text>
    </g>
    <g stroke="currentColor" stroke-width="1" opacity=".5" marker-end="url(#arB)">
      <line x1="322" y1="92" x2="558" y2="52"/><line x1="322" y1="116" x2="558" y2="56"/>
      <line x1="322" y1="140" x2="558" y2="108"/>
      <line x1="322" y1="164" x2="558" y2="160"/><line x1="322" y1="188" x2="558" y2="166"/>
      <line x1="322" y1="212" x2="558" y2="220"/>
      <line x1="322" y1="236" x2="558" y2="272"/><line x1="322" y1="260" x2="558" y2="278"/>
      <line x1="322" y1="284" x2="558" y2="330"/><line x1="322" y1="356" x2="558" y2="340"/>
    </g>
  </g>
</svg>
