<svg viewBox="0 0 980 280" xmlns="http://www.w3.org/2000/svg" color="#151b1e" font-family="Helvetica Neue, Arial, system-ui, sans-serif" font-size="12" role="img" aria-label="Bags are packed onto an identity and produce traits; the session's selected traits union into a grant, bounds such as readonly and no-egress subtract from it, and the result is the session's allowed namespaces, denied tools and access, file, shell and network rules, and native tool grants.">
  <rect x="-5" y="-5" width="990" height="290" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
  <g font-family="Helvetica Neue, Arial, system-ui, sans-serif" font-size="12.5" fill="currentColor">
    <text x="85" y="26" text-anchor="middle" font-weight="600" font-size="13">Bags (packed)</text>
    <g stroke="#2a78d6" stroke-width="1.5" fill="#ffffff">
      <rect x="20" y="40" width="130" height="34" rx="5"/><rect x="20" y="84" width="130" height="34" rx="5"/><rect x="20" y="128" width="130" height="34" rx="5"/><rect x="20" y="172" width="130" height="34" rx="5"/><rect x="20" y="216" width="130" height="34" rx="5"/>
    </g>
    <g text-anchor="middle" font-family="SF Mono, Menlo, Consolas, ui-monospace, monospace" font-size="12">
      <text x="85" y="62">filesystem</text><text x="85" y="106">bash</text><text x="85" y="150">sessions</text><text x="85" y="194">embeddings</text><text x="85" y="238">github (ext.)</text>
    </g>
    <rect x="8" y="8" width="154" height="262" rx="8" fill="none" stroke="#4a3aa7" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="305" y="26" text-anchor="middle" font-weight="600" font-size="13">Traits (grant)</text>
    <g stroke="#1baf7a" stroke-width="1.5" fill="#ffffff">
      <rect x="230" y="40" width="150" height="34" rx="5"/><rect x="230" y="84" width="150" height="34" rx="5"/><rect x="230" y="128" width="150" height="34" rx="5"/><rect x="230" y="172" width="150" height="34" rx="5"/>
    </g>
    <g text-anchor="middle" font-family="SF Mono, Menlo, Consolas, ui-monospace, monospace" font-size="12">
      <text x="305" y="62">filesystem</text><text x="305" y="106">bash</text><text x="305" y="150">sessions</text><text x="305" y="194">embeddings</text>
    </g>
    <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)" opacity=".7">
      <line x1="152" y1="57" x2="228" y2="57"/><line x1="152" y1="101" x2="228" y2="101"/><line x1="152" y1="145" x2="228" y2="145"/><line x1="152" y1="189" x2="228" y2="189"/>
    </g>
    <text x="190" y="48" text-anchor="middle" font-size="10.5" fill="#7c8689">pack</text>
    <circle cx="470" cy="140" r="26" fill="#ffffff" stroke="currentColor" stroke-width="1.5"/>
    <text x="470" y="145" text-anchor="middle" font-size="18" font-weight="700">∪</text>
    <text x="470" y="186" text-anchor="middle" font-size="11.5" fill="#7c8689">selected traits</text>
    <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)" opacity=".7">
      <line x1="382" y1="57" x2="446" y2="125"/><line x1="382" y1="101" x2="442" y2="132"/><line x1="382" y1="145" x2="442" y2="142"/>
    </g>
    <line x1="382" y1="189" x2="440" y2="160" stroke="#7c8689" stroke-width="1.2" stroke-dasharray="3 3" opacity=".6"/>
    <text x="640" y="26" text-anchor="middle" font-weight="600" font-size="13">Bounds (restrict)</text>
    <g stroke="#e34948" stroke-width="1.5" fill="#ffffff">
      <rect x="560" y="40" width="160" height="34" rx="5"/><rect x="560" y="84" width="160" height="34" rx="5"/>
    </g>
    <g text-anchor="middle" font-family="SF Mono, Menlo, Consolas, ui-monospace, monospace" font-size="12">
      <text x="640" y="62">readonly</text><text x="640" y="106">no-egress</text>
    </g>
    <text x="640" y="134" text-anchor="middle" font-size="11.5" fill="#7c8689">deniedTools · deniedAccess</text>
    <text x="640" y="149" text-anchor="middle" font-size="11.5" fill="#7c8689">files · bash · network · native</text>
    <circle cx="640" cy="200" r="26" fill="#ffffff" stroke="currentColor" stroke-width="1.5"/>
    <text x="640" y="206" text-anchor="middle" font-size="20" font-weight="700">−</text>
    <g stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)" opacity=".7">
      <line x1="640" y1="158" x2="640" y2="172"/>
      <line x1="498" y1="140" x2="612" y2="190"/>
    </g>
    <rect x="770" y="100" width="190" height="124" rx="8" fill="#d9eef0" stroke="#0e7c86" stroke-width="1.5"/>
    <g font-family="SF Mono, Menlo, Consolas, ui-monospace, monospace" font-size="11.5" text-anchor="middle">
      <text x="865" y="140">allowed namespaces</text><text x="865" y="158">denied tools / access</text><text x="865" y="176">file, shell, net rules</text><text x="865" y="194">native tool grants</text>
    </g>
    <line x1="668" y1="200" x2="768" y2="170" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)" opacity=".7"/>
  </g>
</svg>
