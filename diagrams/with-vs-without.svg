<svg viewBox="0 0 980 580" role="img" aria-label="Four rows comparing without Barry and with Barry. Wiring: without, each harness is wired to each tool by hand, four times over; with, wired once through Barry and any harness can be in front. Control: without, a system prompt asks the model not to push or touch .env while every tool is still available; with, a readonly bound denies Write, Edit and Bash so they never reach the model and every call is ruled. When it runs: without, only while you watch and only on this Mac; with, a schedule runs it at 2 am, a worker on another machine runs it and retries, and your phone is told the result, under the same policy. What is kept: without, scattered per-vendor transcripts and the next session starts from zero; with, one store of sessions, runs, events and memory, searchable, remembered next session, backed up together." xmlns="http://www.w3.org/2000/svg" color="#151b1e" font-family="Helvetica Neue, Arial, system-ui, sans-serif" font-size="12"><rect x="-5" y="-5" width="990" height="590" fill="#ffffff"/>
  <defs><marker id="arP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
  <g fill="currentColor">

    <text x="245" y="34" text-anchor="middle" font-weight="600" font-size="13">Without Barry</text>
    <text x="735" y="34" text-anchor="middle" font-weight="600" font-size="13">With Barry</text>
    <line x1="490" y1="46" x2="490" y2="566" stroke="currentColor" stroke-width="1" opacity=".15"/>

    <!-- ================= Row 1: wiring ================= -->
    <text x="30" y="64" font-size="11" font-weight="600" fill="#7c8689">WIRING</text>

    <g stroke="#7c8689" stroke-width="1" opacity=".45" fill="none">
      <path d="M150 85 L320 85 M150 85 L320 114 M150 85 L320 143 M150 114 L320 85 M150 114 L320 114 M150 114 L320 143 M150 143 L320 85 M150 143 L320 114 M150 143 L320 143"/>
    </g>
    <g fill="#ffffff" stroke="#4a3aa7" stroke-width="1.2">
      <rect x="40" y="74" width="110" height="22" rx="4"/><rect x="40" y="103" width="110" height="22" rx="4"/><rect x="40" y="132" width="110" height="22" rx="4"/>
      <rect x="320" y="74" width="110" height="22" rx="4"/><rect x="320" y="103" width="110" height="22" rx="4"/><rect x="320" y="132" width="110" height="22" rx="4"/>
    </g>
    <g text-anchor="middle" font-size="10.5">
      <text x="95" y="89">Claude Code</text><text x="95" y="118">Codex</text><text x="95" y="147">Cursor</text>
      <text x="375" y="89">GitHub</text><text x="375" y="118">Datadog</text><text x="375" y="147">Slack</text>
    </g>
    <text x="245" y="170" text-anchor="middle" font-size="10.5" fill="#4a5558">each harness wired to each tool by hand, four times over</text>

    <g fill="#ffffff" stroke="#4a3aa7" stroke-width="1.2">
      <rect x="530" y="74" width="110" height="22" rx="4"/><rect x="530" y="103" width="110" height="22" rx="4"/><rect x="530" y="132" width="110" height="22" rx="4"/>
      <rect x="810" y="74" width="110" height="22" rx="4"/><rect x="810" y="103" width="110" height="22" rx="4"/><rect x="810" y="132" width="110" height="22" rx="4"/>
    </g>
    <g text-anchor="middle" font-size="10.5">
      <text x="585" y="89">Claude Code</text><text x="585" y="118">Codex</text><text x="585" y="147">Cursor</text>
      <text x="865" y="89">GitHub</text><text x="865" y="118">Datadog</text><text x="865" y="147">Slack</text>
    </g>
    <g stroke="currentColor" stroke-width="1.1" opacity=".6" fill="none">
      <path d="M642 85 H654 V143 H642 M642 114 H654"/>
      <path d="M808 85 H796 V143 H808 M808 114 H796"/>
    </g>
    <g stroke="currentColor" stroke-width="1.1" opacity=".6" marker-end="url(#arP)">
      <line x1="654" y1="114" x2="688" y2="114"/>
      <line x1="762" y1="114" x2="794" y2="114"/>
    </g>
    <rect x="690" y="84" width="70" height="60" rx="5" fill="#d9eef0" stroke="#0e7c86" stroke-width="1.5"/>
    <text x="725" y="118" text-anchor="middle" font-weight="600" font-size="13">Barry</text>
    <text x="735" y="170" text-anchor="middle" font-size="10.5" fill="#4a5558">wired once, in one place; put any harness in front</text>

    <!-- ================= Row 2: control ================= -->
    <text x="30" y="194" font-size="11" font-weight="600" fill="#7c8689">CONTROL</text>

    <rect x="40" y="204" width="190" height="68" rx="5" fill="#ffffff" stroke="#7c8689" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="135" y="223" text-anchor="middle" font-size="11" font-weight="600">system prompt</text>
    <text x="135" y="240" text-anchor="middle" font-size="10.5" fill="#4a5558" font-style="italic">“please don't push”</text>
    <text x="135" y="255" text-anchor="middle" font-size="10.5" fill="#4a5558" font-style="italic">“don't touch .env”</text>
    <g stroke="currentColor" stroke-width="1.1" opacity=".6" marker-end="url(#arP)"><line x1="232" y1="238" x2="258" y2="238"/></g>
    <rect x="260" y="204" width="190" height="68" rx="5" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.2"/>
    <text x="355" y="223" text-anchor="middle" font-size="11" font-weight="600">tools the model can call</text>
    <text x="355" y="240" text-anchor="middle" font-size="10.5" fill="#4a5558">Read · Grep · Write · Edit · Bash</text>
    <text x="355" y="255" text-anchor="middle" font-size="10.5" fill="#4a5558">git push · curl · cat .env</text>
    <text x="245" y="298" text-anchor="middle" font-size="10.5" fill="#4a5558">a limit is a request; everything stays callable</text>

    <rect x="530" y="204" width="206" height="68" rx="5" fill="#d9eef0" stroke="#0e7c86" stroke-width="1.3"/>
    <text x="633" y="223" text-anchor="middle" font-size="11" font-weight="600">bound: readonly</text>
    <text x="633" y="240" text-anchor="middle" font-size="9.5" font-family="SF Mono, Menlo, Consolas, monospace" fill="#4a5558">deniedTools: [Write, Edit, Bash]</text>
    <text x="633" y="255" text-anchor="middle" font-size="9.5" font-family="SF Mono, Menlo, Consolas, monospace" fill="#4a5558">network: { actions: [write] }</text>
    <g stroke="currentColor" stroke-width="1.1" opacity=".6" marker-end="url(#arP)"><line x1="738" y1="238" x2="756" y2="238"/></g>
    <rect x="758" y="204" width="182" height="68" rx="5" fill="#ffffff" stroke="#0e7c86" stroke-width="1.2"/>
    <text x="849" y="223" text-anchor="middle" font-size="11" font-weight="600">tools the model can call</text>
    <text x="849" y="240" text-anchor="middle" font-size="10.5" fill="#4a5558">Read · Grep · Glob · search</text>
    <text x="849" y="255" text-anchor="middle" font-size="10.5" fill="#9aa3a6">Write · Edit · Bash · git push</text>
    <line x1="782" y1="251" x2="916" y2="251" stroke="#e34948" stroke-width="1.2"/>
    <text x="735" y="298" text-anchor="middle" font-size="10.5" fill="#4a5558">a limit is enforced: denied tools never reach the model, and every call is ruled</text>

    <!-- ================= Row 3: when it runs ================= -->
    <text x="30" y="324" font-size="11" font-weight="600" fill="#7c8689">WHEN IT RUNS</text>

    <rect x="40" y="334" width="130" height="60" rx="5" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.2"/>
    <text x="105" y="357" text-anchor="middle" font-size="11" font-weight="600">your terminal</text>
    <text x="105" y="374" text-anchor="middle" font-size="10.5" fill="#4a5558">while you watch</text>
    <rect x="200" y="334" width="120" height="60" rx="5" fill="#ffffff" stroke="#7c8689" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="260" y="357" text-anchor="middle" font-size="11" font-weight="600" fill="#7c8689">2 am</text>
    <text x="260" y="374" text-anchor="middle" font-size="10.5" fill="#7c8689">nothing runs</text>
    <rect x="350" y="334" width="100" height="60" rx="5" fill="#ffffff" stroke="#7c8689" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="400" y="357" text-anchor="middle" font-size="11" font-weight="600" fill="#7c8689">other Macs</text>
    <text x="400" y="374" text-anchor="middle" font-size="10.5" fill="#7c8689">idle</text>
    <text x="245" y="420" text-anchor="middle" font-size="10.5" fill="#4a5558">only while you watch, only on this machine</text>

    <g fill="#ffffff" stroke="#0e7c86" stroke-width="1.2">
      <rect x="530" y="334" width="96" height="60" rx="5"/>
      <rect x="636" y="334" width="96" height="60" rx="5"/>
      <rect x="742" y="334" width="96" height="60" rx="5"/>
      <rect x="848" y="334" width="96" height="60" rx="5"/>
    </g>
    <g text-anchor="middle">
      <text x="578" y="357" font-size="11" font-weight="600">your terminal</text>
      <text x="578" y="374" font-size="10.5" fill="#4a5558">a session</text>
      <text x="684" y="357" font-size="11" font-weight="600">2 am</text>
      <text x="684" y="374" font-size="10.5" fill="#4a5558">a schedule runs it</text>
      <text x="790" y="357" font-size="11" font-weight="600">another Mac</text>
      <text x="790" y="374" font-size="10.5" fill="#4a5558">a worker, retried</text>
      <text x="896" y="357" font-size="11" font-weight="600">your phone</text>
      <text x="896" y="374" font-size="10.5" fill="#4a5558">told the result</text>
    </g>
    <g stroke="currentColor" stroke-width="1.1" opacity=".6" marker-end="url(#arP)">
      <line x1="628" y1="364" x2="634" y2="364"/><line x1="734" y1="364" x2="740" y2="364"/><line x1="840" y1="364" x2="846" y2="364"/>
    </g>
    <text x="735" y="420" text-anchor="middle" font-size="10.5" fill="#4a5558">on a schedule, on other machines, in your pocket, under the same policy</text>

    <!-- ================= Row 4: what is kept ================= -->
    <text x="30" y="454" font-size="11" font-weight="600" fill="#7c8689">WHAT IS KEPT</text>

    <g fill="#ffffff" stroke="#7c8689" stroke-width="1.2" stroke-dasharray="4 3">
      <rect x="40" y="464" width="130" height="56" rx="5"/>
      <rect x="180" y="464" width="130" height="56" rx="5"/>
      <rect x="320" y="464" width="130" height="56" rx="5"/>
    </g>
    <g text-anchor="middle">
      <text x="105" y="485" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace">~/.claude/projects</text>
      <text x="105" y="502" font-size="10.5" fill="#7c8689">a transcript, maybe</text>
      <text x="245" y="485" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace">~/.codex/sessions</text>
      <text x="245" y="502" font-size="10.5" fill="#7c8689">another format</text>
      <text x="385" y="485" font-size="10" font-family="SF Mono, Menlo, Consolas, monospace">.cursor/</text>
      <text x="385" y="502" font-size="10.5" fill="#7c8689">nothing</text>
    </g>
    <text x="245" y="546" text-anchor="middle" font-size="10.5" fill="#4a5558">scattered per vendor; the next session starts from zero</text>

    <rect x="530" y="464" width="414" height="56" rx="5" fill="#e9f3f4" stroke="#0e7c86" stroke-width="1.3"/>
    <text x="737" y="485" text-anchor="middle" font-size="11" font-weight="600">one store: sessions · runs · events · memory</text>
    <text x="737" y="502" text-anchor="middle" font-size="10.5" fill="#4a5558">any harness · searchable · remembered next session · backed up together</text>
    <text x="735" y="546" text-anchor="middle" font-size="10.5" fill="#4a5558">one record; every session starts knowing what the last one learned</text>
  </g>
</svg>
