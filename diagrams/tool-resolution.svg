<svg viewBox="0 0 920 288" xmlns="http://www.w3.org/2000/svg" color="#1f2328" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="Tool resolution under ADR 0001: a session's tools resolve from identity inheritance (base to parent to child, narrowing bounds only) and bag composition, pass through Agent Gateway (_barrygateway) for bounds enforcement, workspace path mediation, filtered tool lists, and per-call checks, then dispatch via MCP Server (mcp.server) to in-process Bag Tools, Agent Objects (Barry.object), or external MCP servers routed outbound through Barry Edge allow-listed egress.">
  <rect width="920" height="288" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="#7d8590"/>
    </marker>
    <marker id="arTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9z" fill="#0e7c86"/>
    </marker>
  </defs>

  <!-- Column Headers -->
  <g text-anchor="middle" font-size="10.5" font-weight="600" letter-spacing="1.2" fill="#6e7781">
    <text x="110" y="24">IDENTITY &amp; BAGS</text>
    <text x="362" y="24">AGENT GATEWAY</text>
    <text x="588" y="24">MCP SERVER</text>
    <text x="802" y="24">EXECUTION TARGETS</text>
  </g>

  <!-- Stage 1: Identity Inheritance & Bag Composition -->
  <rect x="16" y="40" width="188" height="90" rx="8" fill="#eef4fc" stroke="#9cc0ee" stroke-width="1.2"/>
  <text x="110" y="61" text-anchor="middle" font-weight="600" font-size="11.5" fill="#1f2328">Identity inheritance</text>
  <text x="110" y="81" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#0969da">base → parent → child</text>
  <text x="110" y="100" text-anchor="middle" font-size="10" fill="#57606a">child narrows bounds only</text>
  <text x="110" y="116" text-anchor="middle" font-size="10" fill="#6e7781">default bags &amp; bounds</text>

  <rect x="16" y="144" width="188" height="126" rx="8" fill="#ecf8f3" stroke="#8fd4b9" stroke-width="1.2"/>
  <text x="110" y="165" text-anchor="middle" font-weight="600" font-size="11.5" fill="#1f2328">Bag composition</text>
  <g fill="#ffffff" stroke="#8fd4b9" stroke-width="1">
    <rect x="28" y="176" width="78" height="24" rx="5"/>
    <rect x="114" y="176" width="78" height="24" rx="5"/>
    <rect x="28" y="206" width="78" height="24" rx="5"/>
    <rect x="114" y="206" width="78" height="24" rx="5"/>
  </g>
  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#1f2328">
    <text x="67" y="192">filesystem</text>
    <text x="153" y="192">bash</text>
    <text x="67" y="222">sessions</text>
    <text x="153" y="222">custom</text>
  </g>
  <text x="110" y="248" text-anchor="middle" font-size="10" fill="#57606a">session bag selection</text>
  <text x="110" y="261" text-anchor="middle" font-size="9.5" fill="#6e7781">denials union · allowlists intersect</text>

  <!-- Stage 1 -> Stage 2 arrows -->
  <path d="M204 85 H224 V136 H244" fill="none" stroke="#7d8590" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M204 207 H224 V172 H244" fill="none" stroke="#7d8590" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- Stage 2: Agent Gateway -->
  <rect x="246" y="40" width="232" height="230" rx="8" fill="#eaf5f6" stroke="#0e7c86" stroke-width="1.5"/>
  <text x="362" y="61" text-anchor="middle" font-weight="600" font-size="12" fill="#1f2328">Agent Gateway</text>
  <text x="362" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#0e7c86">_barrygateway</text>

  <!-- Bounds card -->
  <rect x="260" y="86" width="204" height="52" rx="6" fill="#fdf0f0" stroke="#f0a5a4" stroke-width="1.1"/>
  <text x="362" y="104" text-anchor="middle" font-weight="600" font-size="11" fill="#1f2328">Bounds enforcement</text>
  <text x="362" y="119" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="10" fill="#57606a">tools · inputs · files · network</text>
  <text x="362" y="132" text-anchor="middle" font-size="9.5" fill="#a40e26">deny always wins · fails closed</text>

  <!-- Workspace path mediation card -->
  <rect x="260" y="146" width="204" height="48" rx="6" fill="#ffffff" stroke="#7fbcc2" stroke-width="1.1"/>
  <text x="362" y="165" text-anchor="middle" font-weight="600" font-size="11" fill="#1f2328">Workspace path mediation</text>
  <text x="362" y="182" text-anchor="middle" font-size="10" fill="#57606a">sandbox paths ↔ host mount grants</text>

  <!-- Filtered list & call check card -->
  <rect x="260" y="202" width="204" height="56" rx="6" fill="#ffffff" stroke="#7fbcc2" stroke-width="1.1"/>
  <text x="362" y="220" text-anchor="middle" font-weight="600" font-size="11" fill="#1f2328">Filtered tool list &amp; call check</text>
  <text x="362" y="236" text-anchor="middle" font-size="10" fill="#57606a">withholds denied &amp; native tools</text>
  <text x="362" y="250" text-anchor="middle" font-size="10" fill="#57606a">re-checks every call · adds vault creds</text>

  <!-- Stage 2 -> Stage 3 arrow -->
  <line x1="478" y1="155" x2="518" y2="155" stroke="#0e7c86" stroke-width="1.3" marker-end="url(#arTeal)"/>
  <text x="498" y="147" text-anchor="middle" font-size="10" fill="#0e7c86">allowed</text>

  <!-- Stage 3: MCP Server -->
  <rect x="520" y="95" width="136" height="120" rx="8" fill="#eef4fc" stroke="#4a3aa7" stroke-width="1.4"/>
  <text x="588" y="124" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-weight="600" font-size="12" fill="#1f2328">mcp.server</text>
  <text x="588" y="146" text-anchor="middle" font-size="10.5" fill="#57606a">runs behind</text>
  <text x="588" y="161" text-anchor="middle" font-size="10.5" fill="#57606a">Agent Gateway</text>
  <text x="588" y="184" text-anchor="middle" font-size="10" fill="#6e7781">dispatches</text>
  <text x="588" y="198" text-anchor="middle" font-size="10" fill="#6e7781">tool calls</text>

  <!-- Stage 3 -> Stage 4 branches -->
  <path d="M656 125 H678 V74 H698" fill="none" stroke="#7d8590" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="656" y1="155" x2="698" y2="155" stroke="#7d8590" stroke-width="1.2" marker-end="url(#ar)"/>
  <path d="M656 185 H678 V236 H698" fill="none" stroke="#7d8590" stroke-width="1.2" marker-end="url(#ar)"/>

  <!-- Stage 4: Execution Targets -->
  <!-- Target 1: In-process Bag Tools -->
  <rect x="700" y="40" width="204" height="68" rx="7" fill="#ecf8f3" stroke="#8fd4b9" stroke-width="1.2"/>
  <text x="802" y="61" text-anchor="middle" font-weight="600" font-size="11.5" fill="#1f2328">In-process Bag Tools</text>
  <text x="802" y="78" text-anchor="middle" font-size="10.5" fill="#57606a">direct handler execution</text>
  <text x="802" y="94" text-anchor="middle" font-size="10" fill="#6e7781">scoped vault secrets injected</text>

  <!-- Target 2: Agent Objects -->
  <rect x="700" y="121" width="204" height="68" rx="7" fill="#f5f3fc" stroke="#b5a8e6" stroke-width="1.2"/>
  <text x="802" y="142" text-anchor="middle" font-weight="600" font-size="11.5" fill="#1f2328">Agent Objects</text>
  <text x="802" y="159" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace" font-size="10.5" fill="#4a3aa7">Barry.object</text>
  <text x="802" y="175" text-anchor="middle" font-size="10" fill="#6e7781">durable state &amp; typed operations</text>

  <!-- Target 3: External MCP Servers -->
  <rect x="700" y="202" width="204" height="68" rx="7" fill="#fef7ec" stroke="#e3b36d" stroke-width="1.2"/>
  <text x="802" y="223" text-anchor="middle" font-weight="600" font-size="11.5" fill="#1f2328">External MCP Servers</text>
  <text x="802" y="240" text-anchor="middle" font-size="10.5" fill="#9a4a06">outbound via Barry Edge</text>
  <text x="802" y="256" text-anchor="middle" font-size="10" fill="#6e7781">allow-listed egress only</text>
</svg>
